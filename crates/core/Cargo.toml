[package]
name = "tsumugi-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[features]
# Explicit temporary profile for the existing desktop domain consumers.
# Plugin authority and the shared project ledger remain unchanged.
legacy-desktop-domain = []
execution-test-host = []
wire-schema = ["dep:schemars", "tsumugi-plugin-sdk/schema"]

[dependencies]
tsumugi-plugin-sdk = { path = "../plugin-sdk", version = "=0.1.0-alpha.9", features = ["aws-lc-digest"] }
aws-lc-rs = { version = "=1.18.1", default-features = false, features = ["aws-lc-sys"] }
httpdate = "=1.0.3"
jsonc-parser = "=0.33.2"
language-tags = "=0.3.2"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
roxmltree = "=0.21.1"
rusqlite = { version = "=0.40.2", features = ["backup", "blob", "bundled", "functions", "preupdate_hook"] }
schemars = { version = "=1.2.2", optional = true }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
tempfile = "=3.27.0"
uuid = { version = "1.26.1", features = ["v4"] }
tokio = { version = "=1.53.1", default-features = false, features = ["rt-multi-thread", "time", "macros"] }

[dev-dependencies]
rusqlite = { version = "=0.40.2", features = ["trace"] }
sha2 = "=0.10.9"

[[bin]]
name = "tsumugi-member-wire-schema"
path = "src/bin/member-wire-schema.rs"
required-features = ["wire-schema"]
