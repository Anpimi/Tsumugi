[package]
name = "tsumugi-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[features]
execution-test-host = []
wire-schema = ["dep:schemars", "tsumugi-plugin-sdk/schema"]

[dependencies]
tsumugi-plugin-sdk = { path = "../plugin-sdk", version = "=0.1.0-alpha.1" }
httpdate = "=1.0.3"
jsonc-parser = "=0.33.2"
language-tags = "=0.3.2"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
roxmltree = "=0.21.1"
rusqlite = { version = "=0.40.2", features = ["bundled", "functions"] }
schemars = { version = "=1.2.2", optional = true }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tempfile = "=3.27.0"
uuid = { version = "1.26.1", features = ["v4"] }
tokio = { version = "=1.53.1", default-features = false, features = ["rt-multi-thread", "time", "macros"] }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
# sha2 0.10 gates its Apple silicon SHA instructions behind this feature.
sha2 = { version = "=0.10.9", features = ["asm"] }

[dev-dependencies]
rusqlite = { version = "=0.40.2", features = ["trace"] }

[[bin]]
name = "tsumugi-member-wire-schema"
path = "src/bin/member-wire-schema.rs"
required-features = ["wire-schema"]
