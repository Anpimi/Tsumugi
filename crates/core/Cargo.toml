[package]
name = "tsumugi-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
language-tags = "=0.3.2"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde_json = "=1.0.151"
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
tempfile = "=3.27.0"
