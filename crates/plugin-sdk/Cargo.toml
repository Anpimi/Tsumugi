[package]
name = "tsumugi-plugin-sdk"
version = "0.1.0-alpha.8"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Experimental data contracts and conformance harness for Tsumugi plugins"

[features]
schema = ["dep:schemars"]
native-worker = []
aws-lc-digest = ["dep:aws-lc-rs"]

[[example]]
name = "native-worker"
required-features = ["native-worker"]

[dependencies]
aws-lc-rs = { version = "=1.18.1", default-features = false, features = ["aws-lc-sys"], optional = true }
base64 = "=0.22.1"
schemars = { version = "=1.2.2", optional = true }
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
unicode-segmentation = "=1.13.3"

[[bin]]
name = "tsumugi-plugin-contract"
path = "src/bin/contract.rs"
required-features = ["schema"]
