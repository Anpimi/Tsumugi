[package]
name = "tsumugi-plugin-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Experimental bounded process channels for Tsumugi plugin contracts"

[dependencies]
tsumugi-core = { path = "../core", optional = true }
tsumugi-plugin-sdk = { path = "../plugin-sdk", version = "=0.1.0-alpha.1" }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tempfile = "=3.27.0"
uuid = { version = "=1.26.1", features = ["v4"] }
tokio = { version = "=1.53.1", features = ["rt", "macros", "process", "io-util", "sync", "time"] }
serde = { version = "=1.0.229", features = ["derive"] }
tough = { version = "=0.24.0", default-features = false }
url = "=2.5.8"
jiff = { version = "=0.2.37", features = ["serde"] }
futures-util = { version = "=0.3.34", features = ["io"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[[bin]]
name = "tsumugi-process-conformance-worker"
path = "tests/support/worker.rs"
required-features = ["conformance-worker"]

[[example]]
name = "native-application-worker"
path = "examples/native-application-worker.rs"
required-features = ["native-application-conformance"]

[features]
conformance-worker = []
javascript-conformance = []
native-application-conformance = ["tsumugi-plugin-sdk/native-worker"]
core-adapter = ["dep:tsumugi-core"]
member-conformance = ["core-adapter"]

[dev-dependencies]
aws-lc-rs = "=1.18.1"
tsumugi-core = { path = "../core", features = ["execution-test-host"] }
