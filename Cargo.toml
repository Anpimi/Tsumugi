[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/plugin-sdk",
    "crates/plugin-host",
    "apps/desktop/src-tauri",
]

exclude = ["third_party/tough"]

[patch.crates-io]
tough = { path = "third_party/tough" }

[workspace.package]
version = "0.2.0-alpha.1"
edition = "2024"
rust-version = "1.98"
license = "MIT"
authors = ["Tsumugi contributors"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

# Package/runtime capture keeps fixed deadlines while hashing complete bounded
# trees. Optimize this dependency in local builds without skipping byte checks.
[profile.dev.package.sha2]
opt-level = 3

[profile.test.package.sha2]
opt-level = 3
