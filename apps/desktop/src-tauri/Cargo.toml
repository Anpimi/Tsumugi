[package]
name = "tsumugi-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Tsumugi desktop shell"

[features]
execution-test-host = ["tsumugi-core/execution-test-host"]
wire-schema = ["dep:schemars", "tsumugi-core/wire-schema", "tsumugi-plugin-sdk/schema"]
bundled-runtime = []
bundled-plugins = ["bundled-runtime"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }
tsumugi-plugin-host = { path = "../../../crates/plugin-host" }
tsumugi-plugin-sdk = { path = "../../../crates/plugin-sdk" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[dependencies]
tauri = { version = "2.9.1", features = [] }
tsumugi-core = { path = "../../../crates/core" }
tsumugi-plugin-host = { path = "../../../crates/plugin-host", features = ["core-adapter"] }
tsumugi-plugin-sdk = { path = "../../../crates/plugin-sdk" }
serde = { version = "=1.0.229", features = ["derive"] }
tauri-plugin-dialog = "=2.7.3"
serde_json = "=1.0.151"
schemars = { version = "=1.2.2", optional = true }

[dev-dependencies]
tsumugi-core = { path = "../../../crates/core", features = ["execution-test-host"] }
serde_json = "=1.0.151"
tempfile = "=3.27.0"
tauri = { version = "2.9.1", features = ["test"] }
rusqlite = "=0.40.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.189"
