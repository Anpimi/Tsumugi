[package]
name = "tsumugi-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Tsumugi desktop shell"

[features]
execution-test-host = ["tsumugi-core/execution-test-host"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
tauri = { version = "2.9.1", features = [] }
tsumugi-core = { path = "../../../crates/core" }
serde = { version = "=1.0.229", features = ["derive"] }
tauri-plugin-dialog = "=2.7.3"
serde_json = "=1.0.151"

[dev-dependencies]
serde_json = "=1.0.151"
tempfile = "=3.27.0"
tauri = { version = "2.9.1", features = ["test"] }
rusqlite = "=0.40.2"
